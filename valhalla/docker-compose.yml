version: '3.8'

services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./custom_files:/custom_files
    environment:
      - build_elevation=True
      - tile_urls=https://download.geofabrik.de/asia/india/southern-zone-latest.osm.pbf
      - server_threads=2
    restart: unless-stopped
